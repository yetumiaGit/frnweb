  <script>
  (function () {
    function showError(title, detail) {
      var root = document.getElementById('root');
      if (!root) return;
      root.innerHTML =
        '<div style="max-width:52rem;margin:2rem auto;padding:1.5rem;font-family:Inter,system-ui,sans-serif;border:2px solid #FF001F;background:#FFF5F5;border-radius:.5rem;color:#7F1D1D">' +

          '<p style="margin:0 0 1rem;font-size:.9rem">Le contenu n\u2019a pas pu \u00eatre charg\u00e9. V\u00e9rifiez votre connexion internet puis rechargez la page.</p>' +
          '<pre style="margin:0;padding:.75rem;background:#fff;border-radius:.375rem;font-size:.8rem;white-space:pre-wrap;word-break:break-word">' + detail + '</pre>' +
        '</div>';
    }
    function boot() {
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') { showError('Biblioth\u00e8ques non charg\u00e9es', 'React ou ReactDOM est introuvable.'); return; }
      if (typeof Babel === 'undefined') { showError('Babel non charg\u00e9', 'Babel standalone est introuvable.'); return; }
      var sourceEl = document.getElementById('frn-app-source');
      if (!sourceEl) { showError('Code source introuvable', 'L\u2019\u00e9l\u00e9ment #frn-app-source est absent.'); return; }
      var source = sourceEl.textContent;
      var compiled;
      try { compiled = Babel.transform(source, { presets: ['react'], sourceType: 'script' }).code; }
      catch (err) { console.error('Babel transform error:', err); showError('Erreur de compilation', String(err && err.message ? err.message : err)); return; }
      try { var script = document.createElement('script'); script.text = compiled; document.body.appendChild(script); }
      catch (err) { console.error('Script injection error:', err); showError('Erreur d\u2019ex\u00e9cution', String(err && err.message ? err.message : err)); }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.textContent.indexOf('Refonder') === -1 && root.textContent.indexOf('Refounding') === -1) {
        if (root.innerHTML.indexOf('FF001F') === -1) {
          showError('Chargement incomplet', 'Le site n\u2019a pas pu s\u2019initialiser. V\u00e9rifiez la console (F12) pour plus de d\u00e9tails.');
        }
      }
    }, 4000);
  })();
  </script>
